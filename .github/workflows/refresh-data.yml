name: Refresh official data

on:
  schedule:
    # Every four hours, matching the legacy Compass refresh interval.
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-official-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check for a newer official FET release
        id: check
        run: |
          set +e
          npm run refresh:check
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 0 ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh:check failed with exit code $status"
            exit "$status"
          fi

      - name: Refresh official ERP notices
        id: notices
        continue-on-error: true
        run: |
          npm run refresh:notices
          if git diff --quiet -- public/data/notices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild published timetable and room data
        if: steps.check.outputs.newer == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm run refresh
          npm run refresh:roster

      - name: Verify the refreshed build
        if: steps.check.outputs.newer == 'true' || github.event_name == 'workflow_dispatch' || steps.notices.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - name: Commit refreshed data
        if: steps.check.outputs.newer == 'true' || github.event_name == 'workflow_dispatch' || steps.notices.outputs.changed == 'true'
        id: commit
        run: |
          if git diff --quiet -- public/data; then
            echo "No published data changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh official timetable, room and notice data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed Worker
        if: steps.commit.outputs.changed == 'true'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "Data committed; add CLOUDFLARE_API_TOKEN to repository secrets to deploy automatically."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
